# Single-package workspace (pnpm v11 project settings).
strictPeerDependencies: false
autoInstallPeers: true
nodeLinker: hoisted
blockExoticSubdeps: false

overrides:
  "@tetherto/pearpass-lib-constants": "git+https://github.com/Thaoh/lockwright-lib-constants.git"

publicHoistPattern:
  - '*react-native*'
  - '*expo*'

allowBuilds:
  "@tetherto/pearpass-lib-constants": true
  "@tetherto/pearpass-lib-constants@https://codeload.github.com/Thaoh/lockwright-lib-constants/tar.gz/e8ea95e7456ea9ffc7057bbb97093d6a9563d859": true
  "@tetherto/pearpass-lib-constants@https://codeload.github.com/Thaoh/lockwright-lib-constants/tar.gz/12c63099acf78947e0ce01af279211a2b2eea372": true
  '@sentry/cli': set this to true or false
  "@tetherto/pearpass-lib-vault-core@file:../pearpass-lib-vault-core": true
  "@tetherto/pearpass-lib-vault@file:../pearpass-lib-vault": true
  esbuild: set this to true or false
  unrs-resolver: set this to true or false
  "@sentry/cli@3.4.0": true
  "esbuild@0.25.12": true
  "unrs-resolver@1.12.2": true
